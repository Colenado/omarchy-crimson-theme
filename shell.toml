# Per-section overrides for the Crimson theme.
# Dark mode. Surfaces are deep crimson-tinged near-black; text is warm
# cream; borders and accents are OU Crimson. Mirrors the cream variant's
# `shell.toml` with light surfaces flipped to dark and dark text flipped
# to cream.

[bar]
# Dark bar, cream text, crimson border + accent line.
background       = "#1a0a0b"
background-alpha = 1.0
text             = "#f3e9d2"
active           = "#c4383a"
border           = "#841617"
border-width     = 2

[popups]
background = "#241012"
text       = "#f3e9d2"
placeholder = "#5a544b"
border     = "#841617"

[notifications]
background = "#241012"
text       = "#f3e9d2"
placeholder = "#5a544b"
border     = "#841617"

[menu]
background            = "#241012"
text                  = "#f3e9d2"
placeholder           = "#5a544b"
border                = "#841617"
# Selected-row highlight for menus (Super+Space launcher, omarchy-menu,
# btop selected_bg, etc.). The default `shell.toml.tpl` derives
# selected-background from `foreground` at 8% alpha, which is far too
# faint against the deep near-black background — the highlight blends
# into the panel fill. Bump the alpha so the cream tint is clearly
# visible against the panel, and switch selected-text to pure cream
# white so the row reads as "highlighted text on a cream-warm fill"
# even before the eye finds the side border. Effective fill ~#48352c
# (warm dark amber, lum 0.108), 2.1:1 above panel; cream-white text
# on it sits at ~5.7:1.
selected-background       = "rgba(196,56,58,0.55)"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "rgba(132,22,23,0.9) rgba(196,56,58,0.95) 45deg"
selected-border-alpha     = 0.95
selected-border-width     = "1 1 1 4"

[tooltip]
background = "#241012"
text       = "#f3e9d2"

[launcher]
background = "#241012"
text       = "#f3e9d2"
border     = "#841617"

[polkit]
text   = "#f3e9d2"
border = "#841617"

[image-picker]
background = "#241012"
text       = "#f3e9d2"
border     = "#841617"

[lock]
background              = "#1a0a0b"
text                    = "#f3e9d2"
placeholder             = "#5a544b"
border-active           = "rgba(132,22,23,0.9) rgba(196,56,58,0.95) 45deg"
border-active-width-left = 6

[controls]
# Dark-mode controls: cream foreground fills (low alpha so the dark
# surface shows through), crimson borders, crimson focus ring.
normal-color        = "#f3e9d2"
normal-fill-alpha   = 0.06
normal-border       = "#841617"
normal-border-width = 1
normal-border-alpha = 0.45

hover-cursor-color        = "#c4383a"
hover-cursor-fill-alpha   = 0.14
hover-cursor-border       = "#841617"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.7

focus-color        = "#c4383a"
focus-fill-alpha   = 0.14
focus-border       = "rgba(132,22,23,0.9) rgba(196,56,58,0.95) 45deg"
focus-border-width = 2

selected-color        = "#841617"
selected-fill-alpha   = 0.22
selected-border       = "#841617"
selected-border-width = 1