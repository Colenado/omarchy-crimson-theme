# Crimson — Oklahoma Sooners crimson and cream, dark mode.
# The consolidated Sooners-branded dark theme; pairs the full warm-illustration
# wallpaper set with a deep crimson-tinged near-black background and cream
# foreground.
#
# Wallpapers shipped (pick via omarchy theme bg next, or pin one):
#   - 0-boomer.webp     — pixel-art OU Stadium at sunset
#   - 1-sooner-run.jpeg — Wild West wagons at crimson sunset (1889 Land Run)
#   - 2-oklahoma.jpg    — OkieLandscape poster art: crimson hills, golden river
#   - 3-ou-stadium.jpg  — OU Stadium photographic
#
# Per the OU brand guide, Oklahoma Cream is reserved for print only, so cream
# here is the readable terminal/UI foreground — never a solid background
# fill, matching the dark jersey treatment.
#
# Sister to `noodling/` (cream/light). The two share the Sooners crimson +
# cream palette; cream is the light variant, crimson is the dark variant.
# The four Oklahoma-branded sibling themes that previously lived as
# boomer-sooner/, sooner-run/, oklahoma/ were consolidated into this single
# dark theme so the picker carries one entry per mode.

mode = "dark"

accent = "#841617"
# `selection` drives text-selection backgrounds (terminal selection,
# btop selected_bg, Hermes selection_bg). The default Sooners value of
# #3a0a0c is too close to the deep near-black background for the
# selection band to be visible (~1.26:1). Use the crimson accent at
# full alpha so selected text reads against the panel fill (~6:1
# cream-on-crimson) and the band itself is clearly distinct from the
# background (~2.4:1).
selection = "#841617"
muted = "#5a544b"

background = "#1a0a0b"
dark_background = "#120708"
darker_background = "#0b0405"
lighter_background = "#241012"

foreground = "#dcc095"
dark_foreground = "#7a6655"
light_foreground = "#e8c891"
bright_foreground = "#f3e9d2"

red = "#841617"
yellow = "#a8740e"
orange = "#9c4a0e"
green = "#3f5a18"
cyan = "#3a6a6a"
blue = "#841617"
magenta = "#5a1820"
brown = "#7a3a18"

bright_red = "#c4383a"
bright_yellow = "#c8881a"
bright_green = "#5a7a28"
bright_cyan = "#5a8a8a"
bright_blue = "#c4383a"
bright_magenta = "#7a2a35"

# Hyprland active border: crimson gradient, matches the cream variant's
# hue so both Sooners modes share a recognisable accent.
hyprland_active_border = "rgba(132,22,23,0.9) rgba(196,56,58,0.95) 45deg"