# Crimson — warm-red and cream, dark mode.
# The dark variant; pairs the full warm-illustration wallpaper set with
# a deep warm-red-tinged near-black background and cream foreground.
#
# Wallpapers shipped (pick via omarchy theme bg next, or pin one):
#   - 0-boomer.webp       — pixel-art stadium at sunset
#   - 1-sooner-run.jpeg   — Wild West wagons at warm-red sunset (1889 Land Run)
#   - 2-oklahoma.jpg      — poster art: warm-red hills, golden river
#
# Cream here is the readable terminal/UI foreground — never a solid
# background fill, matching the dark treatment.
#
# Sister to `noodling/` (cream/light). The two share the warm-red +
# cream palette; cream is the light variant, crimson is the dark variant.

mode = "dark"

accent = "#841617"
# `selection` drives text-selection backgrounds (terminal selection,
# btop selected_bg, Hermes selection_bg). The default value of
# #3a0a0c is too close to the deep near-black background for the
# selection band to be visible (~1.26:1). Use the warm-red accent at
# full alpha so selected text reads against the panel fill (~6:1
# cream-on-warm-red) and the band itself is clearly distinct from the
# background (~2.4:1).
selection = "#841617"
muted = "#5a544b"

background = "#1a0a0b"
dark_background = "#120708"
darker_background = "#0b0405"
lighter_background = "#241012"

foreground = "#dcc095"
dark_foreground = "#7a6655"
light_foreground = "#e8c891"
bright_foreground = "#f3e9d2"

red = "#841617"
yellow = "#a8740e"
orange = "#9c4a0e"
green = "#3f5a18"
cyan = "#3a6a6a"
blue = "#841617"
magenta = "#5a1820"
brown = "#7a3a18"

bright_red = "#c4383a"
bright_yellow = "#c8881a"
bright_green = "#5a7a28"
bright_cyan = "#5a8a8a"
bright_blue = "#c4383a"
bright_magenta = "#7a2a35"

# Hyprland active border: warm-red gradient, matches the cream
# variant's hue so both modes share a recognisable accent.
hyprland_active_border = "rgba(132,22,23,0.9) rgba(196,56,58,0.95) 45deg"